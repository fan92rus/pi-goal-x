name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

# Cancel superseded runs: a new push/PR update stops the previous run, so
# runner time is never spent on outdated commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Determine affected checks
        id: changes
        run: node scripts/ci-scope.mjs
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.runtime == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: steps.changes.outputs.runtime == 'true'
        run: npm ci --no-audit --no-fund
      - name: Ranking updater tests
        run: python3 -B scripts/test-update-ranking.py
      - name: Publication workflow tests
        if: steps.changes.outputs.runtime == 'true'
        run: node --test scripts/test-publish-workflow.mjs scripts/test-ci.mjs
      - name: Type check
        if: steps.changes.outputs.runtime == 'true'
        run: npm run check
      - name: Lint
        if: steps.changes.outputs.runtime == 'true'
        run: npm run lint
      - name: Full tests, manifest and installed Pi workflows
        if: steps.changes.outputs.runtime == 'true'
        env:
          PI_GOAL_CI_LOG_DIR: ${{ runner.temp }}/pi-goal-validation
        run: node scripts/ci-checks.mjs
      - name: Package dry run
        if: steps.changes.outputs.runtime == 'true'
        run: npm pack --dry-run
      - name: Production dependency audit
        if: steps.changes.outputs.runtime == 'true'
        run: npm audit --omit=dev
      - name: Context and provider boundaries
        if: steps.changes.outputs.runtime == 'true'
        run: |
          npm run context:gate
          npm run context:provider-check
          node --experimental-strip-types experiments/context/retention-check.mjs
      - name: Check out benchmark base
        if: steps.changes.outputs.runtime == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: .benchmark-base
      - name: Runtime benchmark regression gate
        if: steps.changes.outputs.runtime == 'true'
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" .benchmark-base/node_modules
          # Main preserves compact historical checkpoints; use the corrected fixture for both runs.
          cp experiments/bench/b10-checkpoint-growth.mjs .benchmark-base/experiments/bench/b10-checkpoint-growth.mjs
          npm --prefix .benchmark-base run bench:naf -- after naf
          npm run bench:naf -- after naf
          PI_GOAL_BENCH_REFERENCE="$GITHUB_WORKSPACE/.benchmark-base/experiments/bench/baseline-naf-after.json" npm run bench:gate:naf
      - name: Save failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-failure
          path: |
            ${{ runner.temp }}/pi-goal-validation/
            experiments/runs/goal-controls/
          retention-days: 5
          if-no-files-found: ignore

  compatibility:
    name: compatibility (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: oldest
            sdks: '0.83.0'
            node: 22.15.0
          - group: modern
            sdks: '0.84.1 0.85.1 0.86.0 0.87.0 1.0.0 1.4.0'
            node: 22.19.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Determine affected checks
        id: changes
        run: node scripts/ci-scope.mjs
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.runtime == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install test tools
        if: steps.changes.outputs.runtime == 'true'
        run: npm ci --no-audit --no-fund
      - name: Isolated host, type and provider regressions
        if: steps.changes.outputs.runtime == 'true'
        env:
          HOST_VERSIONS: ${{ matrix.sdks }}
        run: node experiments/continuation/compatibility.mjs $HOST_VERSIONS
      - name: Save failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-failure-${{ matrix.group }}
          path: |
            experiments/runs/continuation-defaults/production-hosts/results.json
            experiments/runs/continuation-defaults/production-hosts/*/*.log
          retention-days: 5
          if-no-files-found: ignore
